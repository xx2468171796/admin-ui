name: Feature request / 功能建议
description: A component, prop or template you need. / 需要的组件、属性或模板。
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: What page or workflow are you building, and what is missing? / 你在做什么页面或流程，缺什么？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior / 建议的 API 或行为
      render: tsx
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives tried / 试过的替代方案
  - type: checkboxes
    id: pr
    attributes:
      label: Contribution / 贡献
      options:
        - label: I can open a pull request for this. / 我可以提交 PR。
