name: Bug report / 问题报告
description: Something renders or behaves wrong. / 组件显示或行为不对。
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version / 版本
      description: "npm ls @adminui/react"
      placeholder: "8.0.1"
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component or subpath / 组件或子路径
      placeholder: "DataTable, @adminui/react/grid …"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, what you expected / 实际结果与期望结果
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction / 最小复现
      description: A StackBlitz / CodeSandbox link or a short code snippet. / 在线复现链接或一段短代码。
      render: tsx
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser, OS, React and bundler versions / 浏览器、系统、React 与打包器版本
      placeholder: "Chrome 140, macOS 26, React 19.2, Vite 6.4"
  - type: textarea
    id: shots
    attributes:
      label: Screenshots / 截图
      description: Light / dark / mobile if relevant. / 视情况附浅色、深色、手机截图。
